conventions: |
  - A pair vs a set of 4 is a different product (count rule from food).
  - OEM vs aftermarket vs reseller vs "fits <make>" are different things (brand != seller != licensor).
  - A part-number match with a conflicting spec is not a match; identifiers never decide alone.
  - Kits (pads + rotors) are sets, not either part.
