# Validator setup v1 (car parts). Checklist steps are proposals until the validator scores better on gold with them.
version: 1
model: gpt-6-luna
web: true
use_proposals: true
inputs: [title, brand, part_type, fitment_text, condition]
checklist:
  - id: similar_brands
    text: Look up brands with similar names (similar_brands); tell the part maker from the vehicle make it fits ("para Toyota" is fitment, not the brand).
    status: proposal
    origin: Pedia licensor rule (brand != licensor); DATA-SPEC car parts
  - id: part_number
    text: If the title has a part number, web-search it to confirm the part type and maker; a number alone never decides.
    status: proposal
    origin: Pedia "identifiers never decide alone"
