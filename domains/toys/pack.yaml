name: toys
families: []
levels: [brand, line, product, variant]
data: toys/
truth: none; source screens and synthetic checks are not gold
readiness: bootstrap_only_no_trusted_taxonomy
conventions: |
  - Preserve set/model numbers, numbered names, editions and scales as identity evidence; never strip bare numerals.
  - Contents or construction pieces are not pack multiplicity; a 300-piece building set is one product, not 300 units.
  - Repeated identical units are listing attributes, never pack nodes; a named mixed playset can be a product.
  - Character, franchise, licensor, seller and compatibility target are separate from the source brand or maker claim.
  - A scale or edition can distinguish an evidenced product; color is a variant only when actually specified.
  - Assorted/random or colors-may-vary offers never establish a particular color or character variant.
  - A toy accessory is a separate product from the complete toy; compatibility alone never identifies its maker.
  - Include only positive human-play toy evidence; games, puzzles and video-game goods are owned by games.
  - Unsupported or conflicting evidence is held with a reason; no department rank supplies a product taxonomy.
