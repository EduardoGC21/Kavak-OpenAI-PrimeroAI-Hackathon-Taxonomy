# Deliberately conservative: the shared token-size default would erase sequels.
# Generic colours/edition/platform/piece tokens can be identity here, so retain them.
variant: {}
size_pattern: '(?!)'
strip: []
bind: [of, the, and, with, for]
settings:
  support_floor: 2
# The shared lattice still flags bare numerals as fragments. Partition and verify
# games identity metadata before accepting any later lattice-generated candidates.
