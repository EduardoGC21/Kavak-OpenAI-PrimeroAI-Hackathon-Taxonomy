# Validator setup v1 (cars). Checklist steps are proposals until the validator scores better on gold with them.
version: 1
model: gpt-6-luna
web: true
use_proposals: false
inputs: [title, make, model, version, year, km, price]
# Starts empty: the improver induces steps from the validator's mistakes on our labels.
checklist: []

