name: games
families: []
levels: [brand, kind, line, product, variant]
data: games/
truth: none; source screening and synthetic checks are not human gold
bootstrap: required; adapter returns no trusted nodes
subtypes: [board_game, card_game, dice_game, domino_game, puzzle, tabletop_accessory,
           video_game_software, video_game_hardware, video_game_accessory, video_game_dlc, video_game_currency]
conventions: |
  - Require supported game identity; broad Toys & Games or Video Games membership is insufficient.
  - Partition by subtype before counting or matching; never merge software, hardware, accessories, currency, DLC, puzzles or tabletop games.
  - Preserve title numerals, sequels, model codes, named sets, puzzle artwork and piece counts; piece count is puzzle identity evidence, not an outer pack count.
  - Base games, expansions and base-plus-expansion bundles are distinct products unless source evidence establishes standalone equivalence.
  - Preserve platform/generation, edition, language and physical/digital evidence. Missing information is unknown, never an implicit standard edition or English disc.
  - A compatible console or game names the accessory target, not its maker or product identity. Sellers and licensed characters never establish brand.
  - Collector bundles require named contents; never silently collapse them into a full game or a figure.
  - Colour, condition, seller, price, age guidance, player count, play time and outer pack count are listing attributes unless evidence proves otherwise.
  - Do not create nodes from source ranks, food-format fields or machine audit decisions. Human review is required before promoting proposals.
