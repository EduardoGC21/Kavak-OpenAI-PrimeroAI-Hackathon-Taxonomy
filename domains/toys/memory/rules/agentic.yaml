- id: ty-identity-and-contents
  text: Preserve set and model numbers, numbered characters, editions and scales; distinguish construction pieces and named set contents from repeated-unit pack multiplicity, and create no pack nodes.
  status: proposal
  origin: toys source inspection and explicit bootstrap conventions
  evidence: Mixed Amazon RAW has numeric building-set identities, RC model codes and scales, piece contents and repeated-unit offers; machine inspection only, no human gold.
- id: ty-brand-provenance
  text: Treat the marketplace brand as an unverified claim and keep maker, licensor, character, seller and compatibility target distinct; missing maker evidence means unknown, never infer it from a shop or franchise.
  status: proposal
  origin: toys source inspection and user instruction
  evidence: Source brand, byline, merchant and titles are distinct fields; licensed figure and compatibility titles demonstrate different roles, without human validation.
- id: ty-variants-and-accessories
  text: Place only on variants explicitly evidenced in the listing, keep random or assorted offers unresolved, and never place an accessory-only product on the complete toy merely because it names that toy.
  status: proposal
  origin: toys source inspection and proposed identity convention
  evidence: Mixed RAW contains colors-may-vary offers and replacement/display/compatibility goods; no gold measurement or trusted catalogue yet.
