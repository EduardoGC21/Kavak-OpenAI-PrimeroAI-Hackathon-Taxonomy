- id: gm-kind-boundary
  text: Keep board/card/dice/domino games, puzzles, tabletop accessories, video-game software, hardware, accessories, DLC and currency separate by subtype; hold evidence conflicts rather than forcing a kind.
  origin: explicit task scope and mixed-source inspection
  evidence: broad departments include toys and nonplay products; no human gold
  status: proposal
- id: gm-base-expansion
  text: Preserve base game, standalone expansion, dependent expansion and base-plus-expansion bundle distinctions; a word expansion alone does not prove it needs a base game.
  origin: games source titles and descriptions
  evidence: observed expansion-only, base-required and standalone-play wording; machine inspection only
  status: proposal
- id: gm-platform-distribution
  text: Preserve platform generations, editions, language and physical versus digital evidence; distinguish full games from DLC, passes, currency and subscriptions, holding unestablished content.
  origin: games source titles and specific category ranks
  evidence: numbered console generations, Digital Code and Disc wording; no human validation
  status: proposal
- id: gm-compatible-not-maker
  text: Identify the accessory's own product and source maker independently of its compatible game or console; a seller, licensed character or compatible-with phrase is never brand evidence.
  origin: explicit task convention and source accessory patterns
  evidence: third-party faceplates, power supplies and flight controls; proposal only
  status: proposal
- id: gm-puzzle-identity
  text: Preserve the puzzle's named artwork or subject, model or set identifier and piece count as identity evidence; outer multipacks, age guidance and dimensions remain attributes.
  origin: source jigsaw puzzle patterns
  evidence: 100, 300, 1000 and 2000-piece source titles; no human validation
  status: proposal
- id: gm-numerals
  text: Preserve meaningful numerals and model codes such as numbered sequels and console generations; do not apply a generic size/count stripping rule to them.
  origin: explicit task convention and conservative vocabulary proposal
  evidence: numbered tabletop titles and gaming model codes; no human gold
  status: proposal
- id: gm-collector-bundle
  text: Distinguish collector editions and bundles by named contents; a figure with a redemption code remains a toy, and an accessory bundle is not the compatible game itself.
  origin: mixed-source licensed figures, bundles and collector editions
  evidence: observed figures with DLC codes and collector software; machine evidence only
  status: proposal
